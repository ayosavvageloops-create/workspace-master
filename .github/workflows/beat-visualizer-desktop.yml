name: Beat Visualizer desktop

# Builds the Electron app on real macOS and Windows machines and publishes the
# installers as the "beat-visualizer-latest" release.
on:
  push:
    branches: [main, master, claude/wonderful-goldberg-fsw5wt]
    paths: ['beat-visualizer/**', '.github/workflows/beat-visualizer-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

# one build at a time; a newer push replaces a build still running
concurrency:
  group: beat-visualizer-desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: beat-visualizer/desktop/dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: beat-visualizer/desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: beat-visualizer/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete beat-visualizer-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create beat-visualizer-latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Beat Visualizer (desktop)" \
            --notes "macOS (Apple Silicon): open the .dmg and drag Beat Visualizer to Applications. The first time, right-click the app and choose Open. Windows: run the Setup .exe; if SmartScreen warns, click More info, then Run anyway."
