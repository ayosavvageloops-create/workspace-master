# Builds FL Tutorial Recorder for Apple Silicon on a real Mac and publishes the DMG as a release.
# DMG: https://github.com/<owner>/<repo>/releases/download/fl-recorder-latest/FL-Tutorial-Recorder-arm64.dmg
name: FL Tutorial Recorder (macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'fl-tutorial-recorder/**'
      - '.github/workflows/fl-recorder-mac.yml'

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    defaults:
      run:
        working-directory: fl-tutorial-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fl-tutorial-recorder/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build app
        run: npx electron-builder --mac dir --arm64 -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # No Apple Developer ID here: an ad-hoc signature is what lets the app run on Apple Silicon.
      - name: Sign ad-hoc and pack DMG
        run: |
          APP="dist/mac-arm64/FL Tutorial Recorder.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "FL Tutorial Recorder" -srcfolder dmgroot -ov -format UDZO FL-Tutorial-Recorder-arm64.dmg

      # Same scheme as the repo's other apps: one fixed tag, replaced on every build,
      # so the download link never changes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fl-recorder-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create fl-recorder-latest FL-Tutorial-Recorder-arm64.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false \
            --title "FL Tutorial Recorder (Mac, Apple Silicon)" \
            --notes "Открой .dmg и перетащи FL Tutorial Recorder в «Программы». Если macOS не даёт открыть: «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть»."
