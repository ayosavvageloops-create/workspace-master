[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reger"
version = "0.1.0"
description = "Vision-model-driven Chrome signup bot"
requires-python = ">=3.12"
dependencies = [
    "patchright",
    "browserforge",
    "httpx",
    "openpyxl",
    "python-dotenv",
    "anthropic",
]

[project.scripts]
reger = "reger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reger*"]
