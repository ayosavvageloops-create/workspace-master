# YTFarm Configuration

db_path: "ytfarm.db"
max_workers: 3
headless: true
timeout: 15000
max_retries: 3

# Proxy list (one per line, format: protocol://user:pass@host:port)
proxies:
  # - "http://user:pass@proxy1.example.com:8080"
  # - "socks5://user:pass@proxy2.example.com:1080"

# Captcha service
captcha_api_key: ""
captcha_provider: "2captcha"  # or "anti-captcha"

# SMS activation service
sms_api_key: ""
sms_provider: "sms-activate"

# Task list
tasks:
  - url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
    watch_seconds: 45
    source: "search"                # search | direct | homepage | recommended
    search_query: "rick astley never gonna give you up"
    actions:
      - "like"
      - "subscribe"
    repeat: 2

  - url: "https://www.youtube.com/watch?v=9bZkp7q19f0"
    watch_seconds: 60
    source: "direct"
    actions:
      - "like"
    repeat: 1

  - url: "https://www.youtube.com/watch?v=kJQP7kiw5Fk"
    watch_seconds: 30
    source: "search"
    search_query: "despacito"
    actions:
      - "like"
      - "subscribe"
      - "comment"
    comment_text: "Great video!"
    repeat: 1
