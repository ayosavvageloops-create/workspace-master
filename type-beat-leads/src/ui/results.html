<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лиды — Type Beat Leads</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <header class="top">
    <div class="brand">Type Beat Leads · Лиды</div>
    <div class="counts" id="counts"></div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Поиск: ник, био, комментарий…" />
    <select id="priority">
      <option value="artists">Только артисты + горячие</option>
      <option value="hot">Только горячие</option>
      <option value="all">Все</option>
      <option value="unchecked">Не проверенные</option>
      <option value="cold">Не артисты</option>
    </select>
    <select id="source">
      <option value="">Любой источник</option>
      <option value="comment">Комментарий</option>
      <option value="tagged">Tagged</option>
      <option value="placement">Плейсмент</option>
    </select>
    <select id="producer"><option value="">Все продюсеры</option></select>
    <select id="statusFilter"><option value="">Любой статус</option></select>
    <button id="exportCsv" type="button" class="primary">Экспорт CSV</button>
    <button id="exportJson" type="button">JSON</button>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Приоритет</th>
          <th>Аккаунт</th>
          <th>Подписчики</th>
          <th>Артист?</th>
          <th>Источник</th>
          <th>Что написал / где найден</th>
          <th>Био</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="empty" class="hint" hidden>Ничего не найдено по фильтрам.</p>
  </div>

  <script type="module" src="results.js"></script>
</body>
</html>
