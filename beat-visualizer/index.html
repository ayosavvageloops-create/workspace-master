<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e14; --panel: #16161f; --line: #262633; --text: #e8e8f0; --muted: #8a8a9c; --accent: #ff3d7f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif;
         display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 14px; min-width: 0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
  label > span { color: var(--muted); }
  input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); color: var(--text);
         border-radius: 6px; padding: 6px 8px; width: 160px; font: inherit; }
  input[type=number] { width: 80px; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 0; }
  input[type=file] { width: 100%; color: var(--muted); font-size: 12px; }
  .file { display: block; margin: 8px 0; }
  .file b { display: block; font-weight: 400; color: var(--muted); margin-bottom: 4px; }
  #modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
           font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.active, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 110px); background: #000; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .transport { display: flex; align-items: center; gap: 12px; width: min(100%, 900px); }
  .transport input[type=range] { flex: 1; width: auto; }
  #time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
  .row { display: flex; gap: 8px; align-items: center; }
  #expStatus { color: var(--accent); font-size: 12px; min-height: 18px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  body.exporting aside :is(input, select, #modes button):not(#export) { pointer-events: none; opacity: .5; }
  @media (max-width: 800px) {
    canvas { max-height: 70vh; }
    body { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); order: 2; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<aside>
  <h1>Beat Visualizer</h1>

  <h2>Files</h2>
  <label class="file"><b>Audio track (mp3, wav, m4a…)</b><input id="audioFile" type="file" accept="audio/*"></label>
  <label class="file"><b>Cover art</b><input id="coverFile" type="file" accept="image/*"></label>
  <label class="file"><b>Background image (defaults to cover)</b><input id="bgFile" type="file" accept="image/*"></label>
  <button id="clearBg" type="button">Clear background</button>

  <h2>Style</h2>
  <div id="modes"></div>

  <h2>Format</h2>
  <label><span>Aspect</span>
    <select data-opt="aspect">
      <option value="16:9">16:9 — YouTube</option>
      <option value="9:16">9:16 — Reels / TikTok</option>
      <option value="1:1">1:1 — Square</option>
      <option value="4:5">4:5 — Instagram feed</option>
    </select>
  </label>

  <h2>Text</h2>
  <label><span>Title</span><input id="title" type="text" data-opt="title"></label>
  <label><span>Artist</span><input type="text" data-opt="artist"></label>
  <label><span>Font</span>
    <select data-opt="font">
      <option>Inter</option><option>Montserrat</option><option>Unbounded</option><option>Georgia</option>
    </select>
  </label>

  <h2>Colors</h2>
  <label><span>Primary</span><input type="color" data-opt="color1"></label>
  <label><span>Secondary</span><input type="color" data-opt="color2"></label>
  <label><span>Background</span><input type="color" data-opt="bgColor"></label>
  <label><span>Background blur</span><input type="range" min="0" max="40" step="1" data-opt="bgBlur"></label>
  <label><span>Background dim</span><input type="range" min="0" max="0.9" step="0.05" data-opt="bgDim"></label>

  <h2>Reaction</h2>
  <label><span>Intensity</span><input type="range" min="0.3" max="2" step="0.05" data-opt="intensity"></label>
  <label><span>Bars</span><input type="range" min="16" max="128" step="4" data-opt="barCount"></label>
  <label><span>Beat sensitivity</span><input id="sensitivity" type="range" min="1.1" max="2" step="0.05" value="1.35"></label>
  <label><span>Glow</span><input type="checkbox" data-opt="glow"></label>
  <label><span>Zoom pulse</span><input type="checkbox" data-opt="zoomPulse"></label>
  <label><span>Shake on beat</span><input type="checkbox" data-opt="shake"></label>
  <label><span>Flash on beat</span><input type="checkbox" data-opt="flash"></label>
  <label><span>Progress bar</span><input type="checkbox" data-opt="showProgress"></label>

  <h2>Export</h2>
  <label><span>FPS</span>
    <select id="fps"><option>30</option><option selected>60</option></select>
  </label>
  <label><span>Start at (s)</span><input id="expFrom" type="number" min="0" value="0"></label>
  <label><span>Length (s, 0 = full)</span><input id="expLen" type="number" min="0" value="0"></label>
  <button id="export" class="primary" type="button" disabled>Export video</button>
  <div id="expStatus"></div>
  <div class="hint">Export records in real time — keep this tab visible until it finishes. Chrome saves MP4, other browsers WebM.</div>
</aside>

<main>
  <div class="stage-wrap"><canvas id="stage"></canvas></div>
  <div class="transport">
    <button id="play" type="button" disabled>Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00 / 0:00</span>
  </div>
</main>

<script src="audio.js"></script>
<script src="modes.js"></script>
<script src="app.js"></script>
</body>
</html>
