<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Visualizer</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="drop-overlay">Drop a beat (wav / mp3) and MIDI files</div>

<main class="stage">
  <div class="stage-inner">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="preview"></canvas>
      <div class="safe" id="safeGuide"></div>
      <div class="empty" id="emptyState">
        <p>Drop a beat anywhere on the page</p>
        <p class="muted">wav or mp3 — add .mid files beside it for the MIDI looks</p>
        <button type="button" id="demoBtn2" class="btn">Try the demo beat</button>
      </div>
    </div>
    <div class="scrub" id="scrub"><div class="scrub-fill" id="scrubFill"></div></div>
    <div class="transport">
      <button type="button" class="chip" id="playBtn" title="Space">play</button>
      <button type="button" class="chip" id="safeBtn">safe area</button>
      <select id="format" class="chip">
        <option value="9:16">9:16</option><option value="16:9">16:9</option><option value="4:5">4:5</option><option value="1:1">1:1</option>
      </select>
      <select id="quality" class="chip" title="Preview resolution">
        <option value="0.5">preview ½</option><option value="1">preview full</option><option value="0.35">preview ⅓</option>
      </select>
      <span class="time" id="timeLabel">00:00.000 / 00:00.000</span>
      <span class="muted small" id="perfLabel"></span>
    </div>
  </div>
</main>

<aside class="panel">
  <header class="panel-head">
    <b>Beat Visualizer</b>
    <input id="search" class="search" placeholder="Search settings ( / )">
  </header>

  <section class="sec">
    <h2><span>1</span> Beat</h2>
    <div class="row-btns">
      <label class="btn file-btn">Choose beat<input type="file" id="beatFile" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg"></label>
      <label class="btn file-btn">Add MIDI<input type="file" id="midiFile" accept=".mid,.midi,audio/midi" multiple></label>
      <button type="button" class="btn" id="demoBtn">Demo</button>
    </div>
    <div class="status muted small" id="beatStatus">No beat loaded.</div>
    <div class="field" data-k="beat title"><label>Title</label><input id="title"></div>
    <div class="field" data-k="tempo bpm"><label>BPM</label><input id="bpm" type="number" min="40" max="240" step="0.1"></div>
    <div class="field" data-k="key"><label>Key</label><input id="key"></div>
    <div class="field" data-k="handle watermark instagram"><label>Handle</label><input id="handle" placeholder="@yourname"></div>
    <div class="field" data-k="clip length duration"><label>Clip length · s</label><input id="clipLen" type="number" min="1" max="210" step="1"></div>
    <div class="field" data-k="start from offset"><label>Start from · s</label><input id="clipStart" type="number" min="0" step="0.1"></div>
    <div class="field" data-k="loudness lufs normalize"><label>Loudness −14 LUFS</label><input id="normalize" type="checkbox" checked></div>
    <div class="field" data-k="visuals follow source midi audio"><label>Visuals follow</label>
      <select id="source"><option value="midi">MIDI notes</option><option value="audio">The audio</option></select></div>
    <div class="field" data-k="midi offset sync align nudge" id="offsetField"><label>MIDI offset · ms</label>
      <div class="row-inline"><input id="midiOffset" type="number" step="5"><button type="button" class="btn" id="alignBtn" title="Line the MIDI up with the beat automatically">Auto</button></div></div>
    <div class="parts" id="partsList"></div>
  </section>

  <section class="sec">
    <h2><span>2</span> Look <em class="muted small" id="lookCount"></em></h2>
    <div class="filters" id="filters">
      <button type="button" data-f="all" class="on">All</button>
      <button type="button" data-f="audio">Audio only</button>
      <button type="button" data-f="midi">With MIDI</button>
    </div>
    <div class="grid" id="lookGrid"></div>
    <div class="look-opts" id="lookOpts"></div>
  </section>

  <section class="sec">
    <h2><span>3</span> Export</h2>
    <div class="field" data-k="fps frame rate"><label>Frame rate</label>
      <select id="fps"><option value="60">60 fps</option><option value="30">30 fps</option></select></div>
    <button type="button" class="btn primary wide" id="exportBtn" disabled>Export MP4</button>
    <div class="progress" id="exportProgress"><div></div></div>
    <div class="status small" id="exportStatus"></div>
  </section>
</aside>

<script src="vendor/mp4-muxer.min.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/analysis.js"></script>
<script src="js/core/midi.js"></script>
<script src="js/core/looks.js"></script>
<script src="js/core/export.js"></script>
<script src="js/core/demo.js"></script>
<script src="js/looks/index.js"></script>
<script src="js/app.js"></script>
</body>
</html>
